
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BrainBoom X³ — Creature Chat Test</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 650px;
      margin: 30px auto;
      padding: 20px;
      background: #f2f5ff;
      color: #202747;
    }
    .panel {
      background: white;
      padding: 22px;
      border-radius: 18px;
      box-shadow: 0 5px 20px #20274715;
    }
    h1 { margin-top: 0; }
    #conversation {
      min-height: 180px;
      max-height: 350px;
      overflow-y: auto;
      padding: 12px;
      background: #f7f8fc;
      border-radius: 12px;
      margin: 18px 0;
    }
    .message {
      padding: 10px 12px;
      margin: 8px 0;
      border-radius: 12px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .pupil { background: #e2edff; }
    .creature { background: #e4f8e9; }
    .error { background: #ffe8e8; color: #8b2020; }
    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border-radius: 10px;
      font-size: 16px;
    }
    input { border: 1px solid #ccd2e0; }
    button {
      border: 0;
      background: #5267d9;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: wait; }
    small { color: #626a80; }
  </style>
</head>
<body>
  <div class="panel">
    <h1>🧠 Creature Chat Test</h1>
    <p id="creatureInfo">Preparing your creature...</p>
    <small>This is a temporary test page. It does not change your main Play page.</small>

    <div id="conversation" aria-live="polite"></div>

    <form id="chatForm">
      <input
        id="messageInput"
        maxlength="500"
        placeholder="Say hello to your creature..."
        autocomplete="off"
        required
      >
      <button id="sendButton" type="submit">Send message</button>
    </form>
  </div>

  <script>
    const conversation = document.getElementById("conversation");
    const input = document.getElementById("messageInput");
    const button = document.getElementById("sendButton");
    const creatureInfo = document.getElementById("creatureInfo");

    let creature = {
      name: "Buddy",
      animal: "a friendly fantasy creature",
      personality: "friendly and curious"
    };

    try {
      const saved = JSON.parse(
        localStorage.getItem("bbx2-player-creatures") || "[]"
      );

      if (saved.length > 0) {
        creature = {
          name: saved[0].name || "Buddy",
          animal: saved[0].animal || "a friendly fantasy creature",
          personality: saved[0].personality || "friendly and curious"
        };
      }
    } catch (error) {
      console.warn("Could not load saved creature.", error);
    }

    creatureInfo.textContent =
      "Talking to: " + creature.name + " 🐾";

    function addMessage(speaker, text, type) {
      const item = document.createElement("div");
      item.className = "message " + type;

      const label = document.createElement("strong");
      label.textContent = speaker + ": ";

      item.appendChild(label);
      item.appendChild(document.createTextNode(text));
      conversation.appendChild(item);
      conversation.scrollTop = conversation.scrollHeight;
    }

    document.getElementById("chatForm").addEventListener(
      "submit",
      async function(event) {
        event.preventDefault();

        const message = input.value.trim();
        if (!message) return;

        addMessage("You", message, "pupil");
        input.value = "";
        button.disabled = true;
        button.textContent = "Thinking...";

        try {
          const response = await fetch("/api/creature-chat", {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              message: message,
              creature: creature
            })
          });

          const data = await response.json();

          if (!response.ok) {
            throw new Error(
              data.error || "The chat request failed."
            );
          }

          addMessage(
            data.creature || creature.name,
            data.reply,
            "creature"
          );
        } catch (error) {
          addMessage(
            "Test error",
            error.message || "Something went wrong. Please try again.",
            "error"
          );
        } finally {
          button.disabled = false;
          button.textContent = "Send message";
          input.focus();
        }
      }
    );
  </script>
</body>
</html>
